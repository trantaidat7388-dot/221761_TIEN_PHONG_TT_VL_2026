version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: word2latex-backend
    volumes:
      - ./backend:/app/backend
      - ./run_api.py:/app/run_api.py
      - ./backend/storage:/app/backend/storage
      - ./backend/database.sqlite:/app/backend/database.sqlite
      - ./backend/word2latex.db:/app/backend/word2latex.db
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: word2latex-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

# Optional: Add a volume for persistent database if needed
# volumes:
#   db-data:
